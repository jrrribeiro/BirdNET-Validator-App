name: Sync app to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sync-hf-space-main
      cancel-in-progress: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_SPACE_ID: jrrribeiro/BirdNET-Validator-App
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "huggingface_hub>=0.32.0"

      - name: Validate Hugging Face configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing required repository secret HF_TOKEN."
            echo "::error::Create it in GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::HF_SPACE_ID is empty."
            exit 1
          fi

      - name: Ensure Hugging Face Space exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]

          api = HfApi(token=token)
          api.create_repo(
              repo_id=space_id,
              repo_type="space",
              exist_ok=True,
              space_sdk="gradio",
          )
          PY


      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HF_USERNAME="$(python - <<'PY'
          import os
          from huggingface_hub import HfApi

          whoami = HfApi(token=os.environ["HF_TOKEN"]).whoami()
          print(whoami["name"])
          PY
          )"
          if [ -z "$HF_USERNAME" ]; then
            echo "::error::Could not resolve Hugging Face username from HF_TOKEN."
            exit 1
          fi
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git push "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git" HEAD:main --force
