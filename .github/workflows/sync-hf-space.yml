name: Sync app to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-space:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sync-hf-space-main
      cancel-in-progress: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HF_SPACE_ID: jrrribeiro/BirdNET-Validator-App
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "huggingface_hub>=0.32.0"

      - name: Validate Hugging Face configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing required repository secret HF_TOKEN."
            echo "::error::Create it in GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          if [ -z "$HF_SPACE_ID" ]; then
            echo "::error::HF_SPACE_ID is empty."
            exit 1
          fi

      - name: Upload repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from huggingface_hub import HfApi
          from huggingface_hub.utils import HfHubHTTPError

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]

          api = HfApi(token=token)
          retry_delays = [30, 90, 180]

          def upload():
              api.upload_folder(
                  repo_id=space_id,
                  repo_type="space",
                  folder_path=".",
                  path_in_repo=".",
                  commit_message="Sync app from GitHub Actions",
                  delete_patterns=["*"],
                  ignore_patterns=[
                      ".git/*",
                      ".github/*",
                      ".pytest_cache/*",
                      ".venv*/*",
                      "**/__pycache__/*",
                      "*.pyc",
                  ],
              )

          for attempt in range(len(retry_delays) + 1):
              try:
                  upload()
                  print(f"Uploaded GitHub main to Hugging Face Space {space_id}.")
                  break
              except HfHubHTTPError as exc:
                  status = getattr(exc.response, "status_code", None)
                  if status in {401, 403}:
                      print(
                          "::error::HF_TOKEN cannot write to the target Space. "
                          "Create a write token for the Space owner and update the "
                          "GitHub Actions HF_TOKEN secret.",
                          file=sys.stderr,
                      )
                      raise
                  if status == 404:
                      print(
                          f"::error::Target Space {space_id} was not found for HF_TOKEN.",
                          file=sys.stderr,
                      )
                      raise

                  transient = status == 429 or status is not None and status >= 500
                  if not transient or attempt == len(retry_delays):
                      print(
                          f"::error::Hugging Face upload failed with HTTP status {status}.",
                          file=sys.stderr,
                      )
                      raise

                  delay = retry_delays[attempt]
                  print(
                      f"::warning::Hugging Face upload returned HTTP {status}; "
                      f"retrying in {delay} seconds.",
                      file=sys.stderr,
                  )
                  time.sleep(delay)
          PY
